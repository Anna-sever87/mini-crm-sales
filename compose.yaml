name: mini-crm-sales

services:
  api:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CRM_DB_PATH: /app/data/crm.db
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
